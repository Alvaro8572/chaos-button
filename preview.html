<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Chaos Button</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        transition: all 0.2s ease;
        background: #111;
        color: white;
    }

    h1 {
        margin-bottom: 20px;
        transition: all 0.2s;
    }

    button {
        padding: 20px 40px;
        font-size: 20px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        background: #ff0055;
        color: white;
        transition: all 0.2s;
    }

    #log {
        margin-top: 30px;
        max-width: 400px;
        text-align: center;
        font-size: 14px;
        opacity: 0.8;
    }
</style>
</head>

<body>

<h1 id="title">CHAOS BUTTON</h1>
<button onclick="chaos()">CLICK ME</button>

<div id="log">Sistema estable... por ahora.</div>

<script>
let clicks = 0;

function chaos() {
    clicks++;

    const body = document.body;
    const title = document.getElementById("title");
    const log = document.getElementById("log");
    const btn = document.querySelector("button");

    // RANDOM COLORS
    body.style.background = randomColor();
    title.style.color = randomColor();
    btn.style.background = randomColor();

    // RANDOM TEXT
    const messages = [
        "El sistema se está rompiendo...",
        "Regla alterada ⚠️",
        "¿Qué has hecho? 😳",
        "Realidad inestable...",
        "BUG DETECTADO",
        "Chaos level: " + clicks,
        "Todo está bien... creo.",
        "🔥🔥🔥"
    ];

    log.innerText = messages[Math.floor(Math.random() * messages.length)];

    // RANDOM EFFECTS
    const effects = [
        () => document.body.style.transform = "rotate(" + (Math.random()*6-3) + "deg)",
        () => document.body.style.transform = "scale(" + (0.9 + Math.random()*0.2) + ")",
        () => document.body.style.filter = "hue-rotate(" + Math.random()*360 + "deg)",
        () => document.body.style.letterSpacing = (Math.random()*10) + "px",
        () => document.body.style.fontSize = (14 + Math.random()*10) + "px"
    ];

    effects[Math.floor(Math.random() * effects.length)]();

    // RESET RANDOMLY
    if (Math.random() < 0.15) {
        setTimeout(() => {
            document.body.style = "";
            log.innerText = "Sistema reiniciado... temporalmente.";
        }, 800);
    }
}

function randomColor() {
    return `hsl(${Math.floor(Math.random()*360)}, 100%, 50%)`;
}
</script>

</body>
</html>
