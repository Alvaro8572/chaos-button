<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaos Button</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: #0a0a12;
  color: white;
  font-family: 'Orbitron', monospace;
  overflow-x: hidden;
  user-select: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 80px;
}

#title {
  font-family: 'Bungee', cursive;
  font-size: 28px;
  letter-spacing: 4px;
  margin: 18px 0 6px;
  text-shadow: 0 0 12px rgba(255, 60, 120, 0.7);
  transition: color 0.3s;
}

#log {
  font-size: 11px;
  letter-spacing: 1px;
  opacity: 0.7;
  height: 16px;
  margin-bottom: 8px;
  animation: panicText 0.4s ease;
}

@keyframes panicText {
  0%   { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(1); opacity: 0.7; }
}

#statsRow {
  display: flex;
  gap: 28px;
  align-items: center;
  margin-bottom: 8px;
}

.stat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.stat-label {
  font-size: 9px;
  letter-spacing: 2px;
  opacity: 0.5;
}

.stat-value {
  font-size: 16px;
  font-weight: bold;
  font-family: 'Bungee', cursive;
}

#coinDisplay { color: #ffd700; }
#clickCounterNumber { color: #ff6688; }

#chaosMeter {
  width: 260px;
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 12px;
}

#chaosFill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #00e5ff, #ff00aa, #ff6600);
  border-radius: 4px;
  transition: width 0.2s ease;
}

#boostBarWrap {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  user-select: none;
  pointer-events: none;
}

.boost-bar-percent {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  color: rgba(255, 180, 60, 0.85);
  text-shadow: 0 0 4px rgba(255, 180, 60, 0.4);
  min-width: 36px;
  text-align: right;
}

.boost-bar-track {
  position: relative;
  width: 240px;
  height: 14px;
  background: rgba(0, 0, 0, 0.65);
  border: 1px solid rgba(255, 180, 60, 0.3);
  border-radius: 7px;
  overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5), 0 0 8px rgba(255, 180, 60, 0.15);
  transition: border-color 0.3s, box-shadow 0.3s;
}

.boost-bar-fill {
  height: 100%;
  min-width: 4px;
  width: 0%;
  background: linear-gradient(90deg, #2196f3, #2196f3 30%, #ffc107 50%, #ff9800 70%, #f44336 100%);
  background-size: 240px 100%;
  border-radius: 4px;
  transition: width 0.08s linear;
}

.boost-bar-track.ready {
  border-color: rgba(76, 175, 80, 0.8);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5), 0 0 14px rgba(76, 175, 80, 0.7);
  animation: boostBarReadyPulse 0.6s ease-in-out infinite;
}

@keyframes boostBarReadyPulse {
  0%, 100% { box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5), 0 0 10px rgba(76, 175, 80, 0.5); }
  50% { box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5), 0 0 22px rgba(76, 175, 80, 1); }
}

.boost-bar-track.active {
  border-color: rgba(244, 67, 54, 0.9);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5), 0 0 18px rgba(244, 67, 54, 0.8);
}

.boost-bar-track.active .boost-bar-fill {
  background: linear-gradient(90deg, #f44336, #ff5722, #ff9800, #ffeb3b, #ff9800, #ff5722, #f44336);
  background-size: 240px 100%;
  animation: boostBarActiveShimmer 0.8s linear infinite;
}

@keyframes boostBarActiveShimmer {
  0% { background-position: 0 0; }
  100% { background-position: 240px 0; }
}

.boost-bar-track.cooldown {
  border-color: rgba(150, 150, 150, 0.4);
  opacity: 0.7;
}

.boost-bar-label {
  display: none;
  position: absolute;
  inset: 0;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  letter-spacing: 1px;
  color: white;
  text-shadow: 0 0 4px rgba(0,0,0,0.8);
}

.boost-bar-label.show { display: flex; }

#boostCounter {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255, 180, 60, 0.6);
  user-select: none;
  pointer-events: none;
  margin-bottom: 6px;
  padding: 4px 10px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 180, 60, 0.15);
  border-radius: 12px;
}

#boostCounterNumber { font-family: 'Bungee', cursive; font-size: 12px; color: #ffc107; }

.chaos-meter {
  font-size: 9px;
  letter-spacing: 2px;
  opacity: 0.4;
  margin-bottom: 14px;
}

#milestoneMsg {
  font-family: 'Bungee', cursive;
  font-size: 14px;
  color: #00e676;
  text-shadow: 0 0 10px rgba(0, 230, 118, 0.8);
  height: 20px;
  margin-bottom: 4px;
  opacity: 0;
  transition: opacity 0.3s;
}

#milestoneMsg.show { opacity: 1; }

#chaosBtn {
  width: 170px;
  height: 170px;
  border-radius: 50%;
  border: 3px solid rgba(255, 80, 120, 0.6);
  background: radial-gradient(circle at 40% 35%, #1a1a2e, #0f0f1a);
  color: #ff4466;
  font-family: 'Bungee', cursive;
  font-size: 15px;
  letter-spacing: 2px;
  cursor: pointer;
  box-shadow: 0 0 30px rgba(255, 50, 100, 0.4), inset 0 0 20px rgba(0,0,0,0.5);
  transition: all 0.15s ease;
  position: relative;
  overflow: hidden;
}

#chaosBtn::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, transparent, rgba(255,80,120,0.3), transparent);
  animation: btnRotate 4s linear infinite;
  z-index: -1;
}

@keyframes btnRotate { to { transform: rotate(360deg); } }

#chaosBtn:hover {
  transform: scale(1.04);
  box-shadow: 0 0 50px rgba(255, 50, 100, 0.6), inset 0 0 20px rgba(0,0,0,0.5);
}

#chaosBtn:active { transform: scale(0.97); }

#chaosBtn.boost-active {
  border-color: #ff3366;
  box-shadow: 0 0 60px rgba(255, 50, 120, 0.8), 0 0 100px rgba(255, 50, 100, 0.4), inset 0 0 20px rgba(0,0,0,0.5);
  animation: boostGlow 0.5s ease-in-out infinite alternate;
}

@keyframes boostGlow {
  from { box-shadow: 0 0 60px rgba(255, 50, 100, 0.8), 0 0 100px rgba(255, 50, 100, 0.4); }
  to { box-shadow: 0 0 80px rgba(255, 50, 100, 1), 0 0 140px rgba(255, 50, 100, 0.6); }
}

#intelBadge {
  display: none;
  position: fixed;
  top: 12px;
  right: 12px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid rgba(0, 230, 118, 0.6);
  box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
}

#intelBadge.show { display: block; }

#profileBar {
  position: fixed;
  top: 12px;
  left: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 8px;
}

#profilePhotoWrap {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid rgba(255, 255, 255, 0.2);
  cursor: pointer;
  position: relative;
}

#profilePhoto {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#profileName {
  font-size: 9px;
  letter-spacing: 1px;
  color: rgba(255, 255, 255, 0.9);
  max-width: 60px;
  text-align: center;
  cursor: text;
  padding: 2px;
}

#profileName:focus {
  outline: none;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
}

#profileSlogan {
  font-size: 8px;
  color: rgba(255, 255, 255, 0.5);
  font-style: italic;
  max-width: 64px;
  text-align: center;
  font-family: 'Orbitron', monospace;
}

#profileEditEl {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 14px;
  height: 14px;
  cursor: pointer;
  opacity: 0.4;
}

#toggleShop {
  position: fixed;
  top: 56px;
  right: 12px;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255, 215, 0, 0.4);
  border-radius: 8px;
  color: #ffd700;
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 6px 14px;
  cursor: pointer;
  transition: all 0.2s;
}

#toggleShop:hover {
  background: rgba(255, 215, 0, 0.15);
  border-color: rgba(255, 215, 0, 0.8);
}

#toggleRoulette {
  position: fixed;
  top: 56px;
  left: 12px;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255, 80, 120, 0.4);
  border-radius: 8px;
  color: #ff6688;
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 6px 14px;
  cursor: pointer;
  transition: all 0.2s;
}

#toggleRoulette:hover {
  background: rgba(255, 80, 120, 0.15);
  border-color: rgba(255, 80, 120, 0.8);
}

#toggleCollection {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(0, 230, 118, 0.4);
  border-radius: 8px;
  color: #00e676;
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  padding: 6px 14px;
  cursor: pointer;
  transition: all 0.2s;
}

#toggleCollection:hover {
  background: rgba(0, 230, 118, 0.15);
  border-color: rgba(0, 230, 118, 0.8);
}

#shopPanel {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 380px;
  max-height: 520px;
  background: rgba(8, 8, 20, 0.97);
  border: 1px solid rgba(255, 215, 0, 0.3);
  border-radius: 16px;
  box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
  z-index: 200;
  flex-direction: column;
  overflow: hidden;
}

#shopPanel.open { display: flex; }

#shopPanelHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255, 215, 0, 0.15);
}

#shopPanelTitle {
  font-family: 'Bungee', cursive;
  font-size: 14px;
  letter-spacing: 3px;
  color: #ffd700;
}

#shopBalance { font-size: 11px; color: rgba(255, 215, 0, 0.7); }

#shopClose {
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.5);
  font-size: 20px;
  cursor: pointer;
  padding: 0;
}

#shopClose:hover { color: white; }

#shopCategoryTitle {
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(255, 215, 0, 0.6);
  padding: 8px 16px 4px;
  font-family: 'Bungee', cursive;
}

#shopList {
  overflow-y: auto;
  padding: 8px 16px 16px;
  flex: 1;
}

#shopList::-webkit-scrollbar { width: 4px; }
#shopList::-webkit-scrollbar-track { background: transparent; }
#shopList::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.3); border-radius: 2px; }

.shop-section-header {
  font-family: 'Bungee', cursive;
  font-size: 11px;
  letter-spacing: 2px;
  color: rgba(255, 215, 0, 0.7);
  text-shadow: 0 0 6px rgba(255, 215, 0, 0.3);
  padding: 10px 0 4px;
  border-bottom: 1px solid rgba(255, 215, 0, 0.15);
  margin-bottom: 8px;
}

.shop-item {
  display: flex;
  align-items: center;
  padding: 8px 10px;
  margin-bottom: 6px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  transition: all 0.2s;
}

.shop-item:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 215, 0, 0.3); }
.shop-item.owned { border-color: rgba(0, 230, 118, 0.4); }
.shop-item.equipped { border-color: rgba(0, 230, 118, 0.8); background: rgba(0, 230, 118, 0.08); }
.shop-item.locked { opacity: 0.5; }
.shop-item.secret-locked { opacity: 0.4; }

.shop-item img, .shop-item .shop-item-thumb {
  width: 40px;
  height: 40px;
  min-width: 40px;
  border-radius: 8px;
  object-fit: cover;
  margin-right: 10px;
  background: rgba(255, 255, 255, 0.1);
}

.shop-item-info { flex: 1; }

.shop-item-name {
  font-size: 11px;
  letter-spacing: 1px;
  color: rgba(255, 255, 255, 0.9);
  margin-bottom: 2px;
}

.shop-item-req {
  font-size: 10px;
  color: rgba(255, 255, 255, 0.45);
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  letter-spacing: 0.5px;
}

.shop-item-req .ok { color: rgba(0, 255, 136, 0.85); }
.shop-item-req .no { color: rgba(255, 80, 80, 0.85); }

.shop-item-action {
  min-width: 72px;
  padding: 6px 10px;
  border-radius: 6px;
  border: none;
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  cursor: pointer;
  background: rgba(255, 215, 0, 0.2);
  color: #ffd700;
  transition: all 0.2s;
}

.shop-item-action:hover:not(:disabled) { background: rgba(255, 215, 0, 0.4); }
.shop-item-action:disabled { opacity: 0.4; cursor: default; }
.shop-item-action.equipped { background: rgba(0, 230, 118, 0.2); color: #00e676; }
.shop-item-action.equip { background: rgba(0, 230, 118, 0.15); color: #00e676; }
.shop-item-action.equip:hover { background: rgba(0, 230, 118, 0.3); }

.shop-item-font-preview {
  width: 40px;
  height: 40px;
  min-width: 40px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.05);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 10px;
  font-size: 12px;
  color: rgba(255, 255, 255, 0.6);
}

.shop-item-slogan-quote {
  font-size: 28px;
  color: rgba(255, 215, 0, 0.5);
  width: 40px;
  min-width: 40px;
  text-align: center;
  margin-right: 8px;
  font-family: Georgia, serif;
  line-height: 1;
}

.shop-item-frame-preview {
  width: 48px;
  height: 48px;
  min-width: 48px;
  border-radius: 50%;
  background: radial-gradient(circle, #2a3a1f, #0a1208);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: rgba(76, 175, 80, 0.7);
  margin-right: 12px;
}

.shop-item-frame-preview.framed-jesus-blessing {
  background: radial-gradient(circle, #4caf50, #1b3a1a);
  color: white;
  font-size: 24px;
  box-shadow: 0 0 10px rgba(76, 175, 80, 0.6);
}

#collectionPanel {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 380px;
  max-height: 520px;
  background: rgba(8, 8, 20, 0.97);
  border: 1px solid rgba(0, 230, 118, 0.3);
  border-radius: 16px;
  box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
  z-index: 200;
  flex-direction: column;
  overflow: hidden;
}

#collectionPanel.open { display: flex; }

#collectionHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid rgba(0, 230, 118, 0.15);
}

#collectionTitle {
  font-family: 'Bungee', cursive;
  font-size: 14px;
  letter-spacing: 3px;
  color: #00e676;
}

#collectionCount { font-size: 10px; color: rgba(0, 230, 118, 0.6); }

#collectionClose {
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.5);
  font-size: 20px;
  cursor: pointer;
}

#collectionList {
  overflow-y: auto;
  padding: 12px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-content: flex-start;
}

#collectionList::-webkit-scrollbar { width: 4px; }
#collectionList::-webkit-scrollbar-track { background: transparent; }
#collectionList::-webkit-scrollbar-thumb { background: rgba(0, 230, 118, 0.3); border-radius: 2px; }

.collection-section-header {
  width: 100%;
  flex-shrink: 0;
  font-family: 'Bungee', cursive;
  font-size: 11px;
  letter-spacing: 2px;
  color: rgba(255, 200, 80, 0.85);
  text-shadow: 0 0 6px rgba(255, 200, 80, 0.4);
  padding: 12px 0 4px;
  border-bottom: 1px solid rgba(255, 200, 80, 0.2);
  margin-bottom: 8px;
}

.collection-empty {
  width: 100%;
  font-size: 10px;
  color: rgba(255, 255, 255, 0.4);
  font-style: italic;
  text-align: center;
  padding: 12px 0;
}

.collection-item {
  flex-shrink: 0;
  width: 120px;
  cursor: pointer;
  border-radius: 10px;
  overflow: hidden;
  border: 2px solid rgba(255, 255, 255, 0.1);
  transition: transform 0.2s, border-color 0.2s;
  background: rgba(255, 255, 255, 0.05);
}

.collection-item:hover { transform: scale(1.05); border-color: rgba(255, 255, 255, 0.4); }
.collection-item video, .collection-item img {
  width: 100%;
  height: 80px;
  object-fit: cover;
  display: block;
}

.collection-item-name {
  font-size: 9px;
  letter-spacing: 1px;
  text-align: center;
  padding: 6px 4px;
  opacity: 0.6;
  font-family: 'Orbitron', monospace;
  color: white;
  background: rgba(0, 0, 0, 0.5);
}

.collectible-item.locked { cursor: default; opacity: 0.55; }
.collectible-item.owned { cursor: pointer; }

.collection-collectible-img-wrap {
  position: relative;
  width: 100%;
  height: 80px;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.collection-collectible-img { width: 100%; height: 100%; object-fit: cover; }

.collection-collectible-lock {
  font-size: 32px;
  opacity: 0.5;
  filter: grayscale(0.8);
}

.collection-collectible-tier-border {
  position: absolute;
  inset: 0;
  border: 2px solid transparent;
  pointer-events: none;
  border-radius: 8px;
}

.tier-common { border-color: rgba(255, 193, 7, 0.5); }
.tier-rare { border-color: rgba(206, 147, 216, 0.5); }
.tier-mythic { border-color: rgba(255, 82, 82, 0.5); }
.tier-jackpot { border-color: rgba(255, 87, 34, 0.5); }

#rouletteModal {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(8, 8, 20, 0.97);
  border: 1px solid rgba(255, 80, 120, 0.3);
  border-radius: 16px;
  box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
  z-index: 200;
  padding: 24px;
  flex-direction: column;
  align-items: center;
  width: 360px;
}

#rouletteModal.show { display: flex; }

.roulette-title {
  font-family: 'Bungee', cursive;
  font-size: 18px;
  letter-spacing: 4px;
  color: #ff6688;
  text-shadow: 0 0 12px rgba(255, 80, 120, 0.5);
  margin-bottom: 16px;
}

.roulette-wheel-container {
  position: relative;
  width: 300px;
  height: 300px;
  margin-bottom: 16px;
}

.roulette-wheel {
  width: 300px;
  height: 300px;
  transition: transform 7.5s cubic-bezier(0.05, 0.85, 0.15, 1.0);
}

.roulette-wheel-sector-bg {
  stroke: rgba(255, 255, 255, 0.1);
  stroke-width: 1;
}

.roulette-pointer {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 20px solid #ffd700;
  filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.8));
  z-index: 10;
}

.roulette-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 50px;
  height: 50px;
  background: radial-gradient(circle, #1a1a2e, #0a0a12);
  border-radius: 50%;
  border: 3px solid #ffd700;
  box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bungee', cursive;
  font-size: 8px;
  letter-spacing: 1px;
  color: #ffd700;
}

.roulette-info {
  display: flex;
  justify-content: space-between;
  align-items: center;

function canCreate() {
  return trackedElements.length < MAX_ELEMENTS;
}

function trackedAppend(el) {
  if (!canCreate()) {
    var oldest = trackedElements.shift();
    if (oldest && oldest.parentNode) oldest.parentNode.removeChild(oldest);
  }
  trackedElements.push(el);
}

function trackedRemove(el) {
  var idx = trackedElements.indexOf(el);
  if (idx !== -1) trackedElements.splice(idx, 1);
}

  if (isOwned(pic.file)) return false;

  return coins >= pic.price;

  if (isOwnedSlogan(s.key)) return false;

}

    if (SHOP_SECRET_SLOGANS[i].key === equipped.slogan) return SHOP_SECRET_SLOGANS[i];

  return null;
}

function buildShopPicture(pic) {
  var owned = isOwned(pic.file);
  var equippedNow = equipped.picture === pic.file;
  var buyable = canBuy(pic);
  var secretLocked = pic.requiresBoosts && boostActivationsCount < pic.requiresBoosts;

  var item = document.createElement("div");
  item.className = "shop-item" + (owned ? " owned" : "") + (equippedNow ? " equipped" : "") + (!owned && !buyable ? " locked" : "") + (secretLocked ? " secret-locked" : "");

  var thumb = document.createElement("img");
  thumb.src = pic.file;
  thumb.alt = pic.name;
  thumb.className = "shop-item-thumb";
  thumb.onerror = function() { this.style.background = "rgba(255,255,255,0.1)"; this.alt = pic.name; };

  var info = document.createElement("div");
  info.className = "shop-item-info";

  var name = document.createElement("div");
  name.className = "shop-item-name";
  name.textContent = secretLocked ? "???" : pic.name;

  var req = document.createElement("div");
  req.className = "shop-item-req";
  if (secretLocked) {
    var reqSpan = document.createElement("span");
    reqSpan.className = "no";
    reqSpan.textContent = "🔒 " + pic.requiresBoosts + " boosts";
    req.appendChild(reqSpan);
  } else if (pic.req) {
    var reqSpan = document.createElement("span");
    reqSpan.className = totalClicks >= pic.req ? "ok" : "no";
    reqSpan.textContent = formatNumber(pic.req) + " clicks";
    req.appendChild(reqSpan);
  }
  if (!secretLocked && pic.price > 0) {
    var priceSpan = document.createElement("span");
    priceSpan.className = coins >= pic.price ? "ok" : "no";
    priceSpan.textContent = pic.price + " 🪙";
    req.appendChild(priceSpan);
  }

  info.appendChild(name);
  info.appendChild(req);

  var action = document.createElement("button");
  action.className = "shop-item-action";
  if (equippedNow) {
    action.classList.add("equipped");
    action.textContent = "EQUIPADA";
    action.disabled = true;
  } else if (owned) {
    action.classList.add("equip");
    action.textContent = "EQUIPAR";
    action.onclick = function() { equipPicture(pic); };
  } else {
    action.textContent = "COMPRAR";
    action.disabled = !buyable;
    action.onclick = function() { buyPicture(pic); };
  }

  item.appendChild(thumb);
  item.appendChild(info);
  item.appendChild(action);
  return item;
}

coinNumberEl.textContent = formatNumber(coins);

if (totalClicks >= 1000) intelBadgeEl.classList.add("show");

function getBoostMultiplier() {
  return isBoostActive() ? 2 : 1;
}
function boostsUnlocked() {
  return boostActivationsCount >= BOOST_REQUIRED_FOR_UNLOCK;
}

function applyBoostClick() {
  if (isBoostActive() || isBoostCooldown()) return;
  boostCharge = Math.min(100, boostCharge + BOOST_CHARGE_PER_CLICK);
  lastBoostClickTime = Date.now();
  saveBoost();
  if (boostCharge >= 100) {
    activateBoost();
  }
}

function decayBoost() {
  if (isBoostActive() || isBoostCooldown()) return;
  if (boostCharge <= 0) return;
  if (Date.now() - lastBoostClickTime < BOOST_DECAY_DELAY_MS) return;
  boostCharge = Math.max(0, boostCharge - BOOST_DECAY_PER_100MS);
  saveBoost();
}

function activateBoost() {
  boostCharge = 0;
  boostActiveUntil = Date.now() + BOOST_DURATION_MS;
  boostCooldownUntil = Date.now() + BOOST_DURATION_MS + BOOST_COOLDOWN_MS;
  boostActivationsCount++;

  addCoins(50, "boost", true);
  showBoostBanner();
  playSoundSafe("powerup.mp3");

  boostCountEl.textContent = formatNumber(boostActivationsCount);

  if (!boostMilestone5Shown && boostActivationsCount >= BOOST_REQUIRED_FOR_UNLOCK) {
    boostMilestone5Shown = true;
    boostCounterEl.classList.add("milestone");
    setTimeout(function() { boostCounterEl.classList.remove("milestone"); }, 1200);
    showToast("¡Secretos desbloqueados en la tienda!", "success");
  }

  saveBoost();
}

function showBoostBanner() {
  boostBannerEl.classList.add("show");
  boostBannerSubEl.textContent = "+50 monedas · 10 segundos";
  setTimeout(function() { boostBannerEl.classList.remove("show"); }, 1800);
}

function saveBoost() {
  localStorage.setItem("chaosBoostCharge", String(boostCharge));
  localStorage.setItem("chaosBoostCooldownUntil", String(boostCooldownUntil));
  localStorage.setItem("chaosBoostActiveUntil", String(boostActiveUntil));
  localStorage.setItem("chaosBoostActivationsCount", String(boostActivationsCount));
  localStorage.setItem("chaosBoostMilestone5", boostMilestone5Shown ? "1" : "0");
}

function isBoostActive() {
  return boostActiveUntil > Date.now();
}
function isBoostCooldown() {
  return boostCooldownUntil > Date.now();
}

boostCountEl.textContent = formatNumber(boostActivationsCount);

function renderBoost() {
  var pct = Math.max(0, Math.min(100, boostCharge));
  boostBarEl.style.width = pct + "%";
  boostBarPercentEl.textContent = Math.floor(pct) + "%";

  if (isBoostActive()) {
    boostBarTrackEl.className = "boost-bar-track active";
    var secs = Math.ceil((boostActiveUntil - Date.now()) / 1000);
    boostBarLabelEl.textContent = "BOOST x2 · " + secs + "s";
    boostBarLabelEl.classList.add("show");
    chaosBtn.classList.add("boost-active");
    boostBarPercentEl.textContent = "x2";
  } else if (isBoostCooldown()) {
    boostBarTrackEl.className = "boost-bar-track cooldown";
    var secs = Math.ceil((boostCooldownUntil - Date.now()) / 1000);
    boostBarLabelEl.textContent = "COOLDOWN · " + secs + "s";
    boostBarLabelEl.classList.add("show");
    chaosBtn.classList.remove("boost-active");
    boostBarPercentEl.textContent = "CD";
  } else if (boostCharge >= 100) {
    boostBarTrackEl.className = "boost-bar-track ready";
    boostBarLabelEl.textContent = "¡LISTO!";
    boostBarLabelEl.classList.add("show");
    chaosBtn.classList.remove("boost-active");
    boostBarPercentEl.textContent = "100%";
  } else {
    boostBarTrackEl.className = "boost-bar-track";
    boostBarLabelEl.classList.remove("show");
    chaosBtn.classList.remove("boost-active");
  }

  boostCountEl.textContent = formatNumber(boostActivationsCount);
}

function boostLoop() {
  decayBoost();
  if (boostActiveUntil > 0 && boostActiveUntil <= Date.now() && !isBoostActive()) {
    boostActiveUntil = 0;
    saveBoost();
  }
  renderBoost();
  setTimeout(boostLoop, 100);
}
boostLoop();
renderBoost();

function getTierColor(tier) {
  if (tier === "common") return "#ffc107";
  if (tier === "rare") return "#9c27b0";
  if (tier === "mythic") return "#f44336";
  if (tier === "jackpot") return "#ff5722";
  return "#888";
}

function rollPrize() {
  var roll = Math.random() * 100;
  var cumulative = 0;
  var prize = ROULETTE_PRIZES[0];
  var probs = [25, 25, 10, 10, 10, 15, 5];
  for (var i = 0; i < ROULETTE_PRIZES.length; i++) {
    cumulative += probs[i];
    if (roll < cumulative) {
      prize = ROULETTE_PRIZES[i];
      break;
    }
  }
  return prize;
}

function spinRoulette() {
  if (rouletteSpinning) return;
  if (coins < ROULETTE_SPIN_COST) {
    showToast("Necesitas " + ROULETTE_SPIN_COST + " monedas", "error");
    return;
  }
  var threshold = getRouletteClicksThreshold();
  if (totalClicks < threshold) {
    showToast("Necesitas " + threshold + " clicks para girar", "error");
    return;
  }

  coins -= ROULETTE_SPIN_COST;
  coinNumberEl.textContent = formatNumber(coins);
  localStorage.setItem("chaosCoins", String(coins));

  rouletteSpinning = true;
  var prize = rollPrize();
  var prizeIndex = ROULETTE_PRIZES.indexOf(prize);
  var targetAngle = -(prizeIndex * ROULETTE_SECTOR_ANGLE + ROULETTE_SECTOR_ANGLE / 2);
  var spins = 5 + Math.random() * 3;
  var totalRotation = rouletteCurrentRotation + spins * 360 + targetAngle;

  playSoundSafe("roulette.mp3");

  var wheel = document.getElementById("rouletteWheel");
  wheel.style.transition = "none";
  wheel.style.transform = "rotate(" + rouletteCurrentRotation + "deg)";
  setTimeout(function() {
    wheel.style.transition = "transform " + ROULETTE_SPIN_DURATION_MS + "ms cubic-bezier(0.05, 0.85, 0.15, 1.0)";
    wheel.style.transform = "rotate(" + totalRotation + "deg)";
    rouletteCurrentRotation = totalRotation;
  }, 50);

  rouletteSpinsCount++;
  saveRouletteState();
  updateRouletteInfo();

  setTimeout(function() {
    rouletteSpinning = false;
    deliverRoulettePrize(prize);
  }, ROULETTE_SPIN_DURATION_MS + 100);
}

function deliverRoulettePrize(prize) {
  var resultEl = document.getElementById("rouletteResult");
  if (prize.coins) {
    addCoins(prize.coins, "roulette", true);
    resultEl.textContent = "+" + prize.coins + " 🪙";
    resultEl.className = "roulette-result";
    showToast("+" + prize.coins + " monedas!", prize.coins === 500 ? "success" : "info");
  } else if (prize.isCollectible) {
    var owned = isCollectibleOwned(prize.id);
    if (owned) {
      addCoins(25, "roulette-duplicate", true);
      resultEl.textContent = "¡" + prize.name + " (x2)! +25 🪙";
      resultEl.className = "roulette-result";
      showToast("¡" + prize.name + " duplicado! +25 monedas", "info");
    } else {
      inventory.collectibles.push(prize.id);
      localStorage.setItem("chaosInventory", JSON.stringify(inventory));
      addCoins(50, "roulette-new", true);
      resultEl.textContent = "¡" + prize.name + "! +50 🪙";
      resultEl.className = "roulette-result";
      showToast("¡Nuevo coleccionable: " + prize.name + "!", "success");
      if (prize.tier === "mythic" || prize.tier === "jackpot") {
        unlockDivineReward(prize);
      }
    }
  }
}

function buildRouletteWheel() {
  var inner = document.getElementById("rouletteWheelInner");
  inner.innerHTML = "";
  var cx = 150, cy = 150, r = 140;
  for (var i = 0; i < ROULETTE_PRIZES.length; i++) {
    var prize = ROULETTE_PRIZES[i];
    var startAngle = i * ROULETTE_SECTOR_ANGLE - 90;
    var endAngle = (i + 1) * ROULETTE_SECTOR_ANGLE - 90;
    var startRad = startAngle * Math.PI / 180;
    var endRad = endAngle * Math.PI / 180;
    var x1 = cx + r * Math.cos(startRad);
    var y1 = cy + r * Math.sin(startRad);
    var x2 = cx + r * Math.cos(endRad);
    var y2 = cy + r * Math.sin(endRad);
    var largeArc = ROULETTE_SECTOR_ANGLE > 180 ? 1 : 0;
    var d = "M" + cx + "," + cy + " L" + x1 + "," + y1 + " A" + r + "," + r + " 0 " + largeArc + " 1 " + x2 + "," + y2 + " Z";
    var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", getTierColor(prize.tier));
    path.setAttribute("class", "roulette-wheel-sector-bg");
    inner.appendChild(path);

    var midAngle = (startAngle + endAngle) / 2;
    var midRad = midAngle * Math.PI / 180;
    var imgCx = cx + (r * 0.62) * Math.cos(midRad);
    var imgCy = cy + (r * 0.62) * Math.sin(midRad);
    var clipId = "roul-clip-" + i;
    var clipPath = document.createElementNS("http://www.w3.org/2000/svg", "clipPath");
    clipPath.setAttribute("id", clipId);
    var clipCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    clipCircle.setAttribute("cx", imgCx);
    clipCircle.setAttribute("cy", imgCy);
    clipCircle.setAttribute("r", 18);
    clipPath.appendChild(clipCircle);
    var defs = inner.querySelector("defs") || (function() {
      var d = document.createElementNS("http://www.w3.org/2000/svg", "defs");
      inner.insertBefore(d, inner.firstChild);
      return d;
    })();
    defs.appendChild(clipPath);

    var bgCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    bgCircle.setAttribute("cx", imgCx);
    bgCircle.setAttribute("cy", imgCy);
    bgCircle.setAttribute("r", 18);
    bgCircle.setAttribute("fill", "#fff");
    inner.appendChild(bgCircle);

    if (prize.img) {
      var image = document.createElementNS("http://www.w3.org/2000/svg", "image");
      image.setAttributeNS("http://www.w3.org/1999/xlink", "href", prize.img);
      image.setAttribute("href", prize.img);
      image.setAttribute("x", imgCx - 16);
      image.setAttribute("y", imgCy - 16);
      image.setAttribute("width", 32);
      image.setAttribute("height", 32);
      image.setAttribute("clip-path", "url(#" + clipId + ")");
      image.setAttribute("preserveAspectRatio", "xMidYMid slice");
      inner.appendChild(image);
    } else {
      var bgC = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      bgC.setAttribute("cx", imgCx);
      bgC.setAttribute("cy", imgCy);
      bgC.setAttribute("r", 18);
      bgC.setAttribute("fill", prize.tier === "jackpot" ? "#ff5722" : "#9c27b0");
      inner.appendChild(bgC);

      var text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", imgCx);
      text.setAttribute("y", imgCy + (prize.tier === "jackpot" ? -1 : 4));
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("fill", "#fff");
      text.setAttribute("font-family", "Bungee, cursive");
      text.setAttribute("font-size", prize.tier === "jackpot" ? "11" : "12");
      text.setAttribute("font-weight", "bold");
      if (prize.tier === "jackpot") {
        text.textContent = "\u2726";
        text.setAttribute("fill", "#ffd700");
        text.setAttribute("font-size", "18");
        text.setAttribute("y", imgCy + 6);
      } else {
        text.textContent = "\uD83E\uDE99";
        text.setAttribute("font-size", "14");
      }
      inner.appendChild(text);
    }
  }
}

function updateRouletteInfo() {

function showToast(msg, type) {
  var toast = document.createElement("div");
  toast.className = "toast " + type;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(function() { toast.classList.add("show"); }, 10);
  setTimeout(function() {
    toast.classList.remove("show");
    setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 400);
  }, 2600);
}
